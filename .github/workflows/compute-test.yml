name: compute-test
on:
  push:
    branches: [compute-test]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Hardware
        run: |
          echo "shard ${{ matrix.shard }}"; nproc; free -g | head -2
          python3 -c "import time,sys; t=time.time(); s=sum(i*i for i in range(30_000_000)); print('py loop s', round(time.time()-t,2))"
